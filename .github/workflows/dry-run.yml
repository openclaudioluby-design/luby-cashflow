name: dry-run (teste)

on:
  workflow_dispatch:   # só manual

jobs:
  dry-run:
    runs-on: self-hosted
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instala dependências
        run: |
          python3 -m pip install --quiet \
            gspread google-auth pandas openpyxl requests pyyaml

      - name: Dry-run com dados mock
        run: python3 main.py --dry-run

      - name: Relatório de teste (local)
        run: |
          echo "Relatórios salvos localmente em: $(pwd)/relatorios/"
          ls -lh relatorios/ 2>/dev/null || echo "Nenhum relatório gerado"
